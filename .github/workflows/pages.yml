name: Publicar Destino Mendoza

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          rm -f .env
          mkdir -p assets/js

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "No se encontró el secreto GOOGLE_API_KEY"
            exit 1
          fi

          printf '{"googleApiKey":"%s"}\n' "$GOOGLE_API_KEY" > assets/js/config.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
